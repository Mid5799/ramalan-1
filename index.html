<h1>Kuiz Fizik SPM 2026 – Ramalan Set 1 (4531/1)</h1>
<div class="sub">33 soalan objektif · pilih jawapan untuk semakan serta-merta</div>

<script>
const Q=[[1, "Antara berikut, yang manakah merupakan kuantiti vektor?", ["Jarak", "Suhu", "Masa", "Sesaran"], 3, "Sesaran mempunyai magnitud dan arah.", ""], [2, "Rajah 1 menunjukkan graf Y melawan X. Pernyataan yang manakah mewakili graf tersebut?", ["Y bertambah dengan X", "Y berkadar songsang dengan X", "Y berkadar terus dengan X", "Y bertambah secara linear dengan X"], 1, "Y berkurang apabila X bertambah dengan lengkung hiperbola: Y ∝ 1/X.", ""], [3, "Rajah 2 menunjukkan sebiji bola dilepaskan dari sebuah bangunan. Apakah perubahan yang berlaku kepada halaju bola semasa bola jatuh?", ["Halaju berkurang secara seragam", "Halaju bertambah secara seragam", "Halaju kekal malar", "Halaju bertambah kemudian berkurang"], 1, "Bola jatuh bebas dengan pecutan graviti malar, maka halaju bertambah secara seragam.", ""], [4, "Satu objek berjisim 0.8 kg ditarik dengan satu daya 120 N selama 10 s. Berapakah impuls yang bertindak ke atas objek tersebut?", ["120 Ns", "800 Ns", "1 200 Ns", "1 500 Ns"], 2, "Impuls = Ft = 120 × 10 = 1 200 Ns.", ""], [5, "Rajah 3 menunjukkan sebuah kapal terbang yang sedang mendarat di landasan. Kapal terbang memerlukan landasan yang panjang untuk mengurangkan kelajuannya secara beransur-ansur sebelum berhenti. Mengapakah kapal terbang memerlukan jarak yang panjang untuk berhenti selepas mendarat?", ["Daya graviti menyebabkan kapal terbang terus bergerak ke hadapan", "Jisim kapal terbang yang besar menyebabkan inersianya besar", "Daya tindak balas landasan menyebabkan kapal terbang memecut ke hadapan", "Jisim kapal terbang yang besar menyebabkan pecutannya bertambah"], 1, "Jisim besar, inersia besar, lebih sukar dihentikan.", ""], [6, "Rajah 4 menunjukkan seorang penunggang basikal yang membrek secara tiba-tiba menyebabkan badannya terus bergerak ke hadapan. Hukum fizik manakah yang menerangkan situasi di atas?", ["Hukum Kegravitian Semesta Newton", "Hukum Gerakan Newton Ketiga", "Hukum Gerakan Newton Kedua", "Hukum Gerakan Newton Pertama"], 3, "Badan cenderung mengekalkan keadaan gerakan asal = inersia (Hukum Gerakan Newton Pertama).", ""], [11, "Rajah 5 menunjukkan seorang pelajar memasukkan beberapa ketul ais ke dalam segelas air panas. Dengan menganggap tiada haba dibebaskan ke persekitaran, apakah keadaan yang berlaku apabila keseimbangan terma tercapai?", ["Suhu air dan ais menjadi sama", "Ais terus mencair sepenuhnya", "Suhu air panas lebih tinggi daripada suhu ais", "Tenaga haba yang diterima ais sama dengan tenaga haba yang diterima air"], 0, "Pada keseimbangan terma, tiada pemindahan haba bersih dan suhu kedua-duanya sama.", ""], [12, "Rajah 6 menunjukkan fenomena bayu darat. Mengapakah fenomena bayu darat berlaku pada waktu malam?", ["Laut mempunyai muatan haba rendah berbanding daratan", "Daratan membebaskan haba lebih cepat berbanding laut", "Daratan menyerap lebih banyak haba berbanding laut pada waktu malam", "Laut mempunyai muatan haba tentu yang lebih rendah menyebabkan laut menjadi sejuk dengan cepat"], 1, "Daratan bermuatan haba tentu rendah, sejuk lebih cepat; udara panas di atas laut naik dan udara sejuk dari darat mengalir ke laut.", ""], [13, "Rajah 7 menunjukkan dua cawan yang masing-masing mengandungi jisim air dan minyak masak yang sama. Kedua-dua cawan menerima tenaga haba pada kadar yang sama. Selepas beberapa ketika, suhu minyak masak meningkat lebih cepat berbanding suhu air. Konsep manakah yang paling sesuai menerangkan perbezaan peningkatan suhu tersebut?", ["Keseimbangan terma", "Kekonduksian terma", "Haba pendam tentu", "Muatan haba tentu"], 3, "Minyak mempunyai muatan haba tentu lebih rendah, maka suhunya naik lebih cepat (Q = mcθ).", ""], [14, "Rajah 8 menunjukkan udara yang terperangkap dalam sebuah picagari. Apabila omboh ditekan pada suhu malar, isi padu udara berkurang. Apakah yang berlaku kepada tekanan udara tersebut?", ["Bertambah", "Berkurang", "Kekal malar", "Menjadi sifar"], 0, "Hukum Boyle: P ∝ 1/V pada suhu malar.", ""], [15, "Rajah 9 menunjukkan sebuah belon yang diletakkan di dalam sebuah bilik berhawa dingin. Apabila belon tersebut dipindahkan ke tempat yang lebih panas, belon mengembang. Apakah hubungan antara isi padu dan suhu gas dalam belon pada tekanan malar?", ["Isi padu gas bertambah apabila suhu meningkat", "Isi padu gas berkurang apabila suhu meningkat", "Isi padu gas kekal malar apabila suhu meningkat", "Isi padu gas tidak dipengaruhi oleh perubahan suhu"], 0, "Hukum Charles: V ∝ T pada tekanan malar.", ""], [16, "Rajah 10 menunjukkan sebuah tayar kereta yang mengandungi udara pada tekanan 220 kPa dan suhu 27 °C. Selepas perjalanan jauh, suhu udara dalam tayar meningkat kepada 57 °C. Anggap isi padu tayar adalah malar. Berapakah tekanan udara dalam tayar selepas perjalanan tersebut?", ["198 kPa", "220 kPa", "242 kPa", "330 kPa"], 2, "Hukum Gay-Lussac: P₁/T₁ = P₂/T₂. P₂ = 220 × 330 / 300 = 242 kPa (T dalam kelvin).", ""], [17, "Rajah 11 menunjukkan gelombang air yang dihasilkan oleh satu sumber titik pada permukaan air. Apakah bentuk muka gelombang yang dihasilkan?", ["Muka gelombang satah", "Muka gelombang lurus", "Muka gelombang selari", "Muka gelombang membulat"], 3, "Sumber titik menghasilkan muka gelombang membulat.", ""], [18, "Seorang pemain gitar memetik tali gitar dan menghasilkan bunyi. Selepas beberapa ketika, bunyi yang dihasilkan menjadi semakin perlahan sehingga akhirnya hilang. Apakah perubahan yang berlaku pada getaran tali gitar tersebut?", ["Amplitud semakin bertambah", "Frekuensi semakin bertambah", "Amplitud semakin berkurang", "Panjang gelombang semakin bertambah"], 2, "Getaran teredam: tenaga berkurang, maka amplitud berkurang.", ""], [19, "Rajah 12 menunjukkan seberkas cahaya bergerak dari udara masuk ke dalam sebuah blok kaca. Apakah kuantiti fizik yang kekal tidak berubah apabila cahaya memasuki kaca?", ["Frekuensi cahaya", "Laju cahaya", "Panjang gelombang cahaya", "Arah perambatan cahaya"], 0, "Frekuensi ditentukan oleh sumber dan tidak berubah semasa pembiasan; laju, panjang gelombang dan arah berubah.", ""], [20, "Rajah 13 menunjukkan dua pembesar suara yang disambungkan kepada satu penjana isyarat audio. Kedua-dua pembesar suara menghasilkan gelombang bunyi yang sama frekuensi dan sefasa. Apakah yang berlaku kepada jarak antara dua kedudukan bunyi kuat berturutan apabila frekuensi bunyi ditingkatkan?", ["Berkurang", "Bertambah", "Kekal malar", "Menjadi sifar"], 0, "λ = v/f. Frekuensi bertambah, λ berkurang. Jarak antara dua maksimum x = λa/D, maka x berkurang.", ""], [21, "Rajah 14 menunjukkan satu rajah sinar yang tidak lengkap bagi sebuah kanta cekung. Tentukan kedudukan imej.", ["A", "B", "C", "D"], 1, "Imej kanta cekung ialah maya, tegak dan diperkecilkan, terbentuk di sebelah objek di antara F dan kanta (titik B).", ""], [22, "Rajah 15 menunjukkan sebuah sumber gelombang menghasilkan gelombang air dengan frekuensi 5 Hz. Jarak antara dua muka gelombang berturutan ialah 0.40 m. Berapakah laju gelombang air tersebut?", ["0.08 m s⁻¹", "2.0 m s⁻¹", "12.5 m s⁻¹", "20.0 m s⁻¹"], 1, "v = fλ = 5 × 0.40 = 2.0 m s⁻¹.", ""], [23, "Rajah 16 menunjukkan sebuah cermin cekung digunakan oleh seorang doktor gigi untuk melihat bahagian gigi pesakit dengan lebih jelas. Apakah sebab cermin cekung sesuai digunakan dalam situasi tersebut?", ["Menghasilkan imej nyata dan dikecilkan", "Menghasilkan imej maya dan dikecilkan", "Menghasilkan imej maya dan dibesarkan", "Menghasilkan imej nyata dan dibesarkan"], 2, "Objek dekat dengan cermin (dalam F): imej maya, tegak dan dibesarkan.", ""], [24, "Rajah 17 menunjukkan sebuah lampu berjisim 2.0 kg digantung pada siling menggunakan dua tali yang sama panjang. Berapakah tegangan, T, pada setiap tali?", ["10.0 N", "11.5 N", "15.5 N", "20.0 N"], 3, "Menegak: 2T sin 30° = mg = 20 N, maka T = 20 N (g = 10 m s⁻²).", ""], [25, "Rajah 18 menunjukkan dua ekor ikan berada pada kedalaman yang berbeza dalam sebuah akuarium. Ikan yang manakah mengalami tekanan air yang lebih tinggi?", ["Ikan yang berada lebih dekat dengan permukaan air", "Tekanan bergantung pada saiz ikan", "Ikan yang berada lebih dalam", "Kedua-dua ikan mengalami tekanan yang sama"], 2, "P = hρg: tekanan bertambah dengan kedalaman.", ""], [26, "Rajah 19(a) menunjukkan sebuah kapal yang membawa beberapa buah kontena. Rajah 19(b) menunjukkan kapal yang sama membawa muatan yang lebih banyak. Apakah perubahan yang berlaku pada kapal apabila muatan ditambah?", ["Isi padu air tersesar berkurang dan daya apungan berkurang", "Isi padu air tersesar bertambah dan daya apungan berkurang", "Isi padu air tersesar bertambah dan daya apungan bertambah", "Isi padu air tersesar tidak berubah dan daya apungan bertambah"], 2, "Kapal tenggelam lebih dalam; air tersesar bertambah, daya apungan = berat kapal, bertambah.", ""], [27, "Rajah 20 menunjukkan sekumpulan pendaki berada di kawasan pergunungan yang tinggi. Apakah perubahan yang berlaku kepada tekanan atmosfera apabila altitud meningkat?", ["Tekanan atmosfera bertambah", "Tekanan atmosfera kekal sama", "Tekanan atmosfera menjadi sifar", "Tekanan atmosfera berkurang"], 3, "Lapisan udara di atas berkurang, maka tekanan atmosfera berkurang.", ""], [28, "Sebatang dawai logam mempunyai rintangan 8 Ω pada suhu tertentu. Apakah yang berlaku kepada rintangan dawai tersebut apabila suhu meningkat?", ["Rintangan berkurang", "Rintangan kekal sama", "Rintangan menjadi sifar", "Rintangan bertambah"], 3, "Suhu tinggi, getaran atom lebih kuat, perlanggaran elektron lebih banyak, rintangan bertambah.", ""], [29, "Rajah 21 menunjukkan dua periuk nasi yang digunakan untuk memasak 500 g beras. Periuk A mempunyai kuasa 900 W manakala periuk B mempunyai kuasa 1500 W. Jika kedua-dua periuk digunakan selama 20 minit, periuk yang manakah menggunakan tenaga elektrik yang lebih banyak?", ["Periuk A kerana kuasanya lebih rendah", "Periuk B kerana kuasanya lebih tinggi", "Kedua-dua periuk menggunakan tenaga yang sama", "Tidak dapat ditentukan"], 1, "E = Pt. Masa sama, kuasa lebih tinggi, tenaga lebih banyak (B: 1 800 kJ; A: 1 080 kJ).", ""], [30, "Rajah 22 menunjukkan sebuah kereta elektrik sedang dicas. Jadual 1 menunjukkan perbandingan kapasiti bateri dan masa pengecasan bagi empat model kereta elektrik.<table style='border-collapse:collapse;margin:8px 0;font-weight:400;width:100%'><tr style='background:var(--bg)'><th style='border:1px solid var(--bd);padding:4px'>Model kereta</th><th style='border:1px solid var(--bd);padding:4px'>Kapasiti bateri (kWh)</th><th style='border:1px solid var(--bd);padding:4px'>Masa mengecas 0–100% (min)</th></tr><tr><td style='border:1px solid var(--bd);padding:4px;text-align:center'>K</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>48</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>30</td></tr><tr><td style='border:1px solid var(--bd);padding:4px;text-align:center'>L</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>54</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>34</td></tr><tr><td style='border:1px solid var(--bd);padding:4px;text-align:center'>M</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>60</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>38</td></tr><tr><td style='border:1px solid var(--bd);padding:4px;text-align:center'>N</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>66</td><td style='border:1px solid var(--bd);padding:4px;text-align:center'>X</td></tr></table>Jadual 1 Berdasarkan pola dalam jadual, apakah masa yang sesuai bagi X?", ["42 min", "46 min", "52 min", "60 min"], 0, "Setiap kenaikan kapasiti 6 kWh menambah 4 min: 30, 34, 38, maka X = 42 min.", ""], [31, "Rajah 23 menunjukkan seutas wayar kuprum berarus yang diletakkan di antara dua kutub magnet. Apakah faktor yang menentukan arah daya yang bertindak ke atas wayar kuprum?", ["Arah arus dan arah medan magnet", "Magnitud arus sahaja", "Rintangan wayar sahaja", "Panjang wayar sahaja"], 0, "Petua tangan kiri Fleming: arah daya bergantung pada arah arus dan arah medan magnet.", ""], [32, "Rajah 24 menunjukkan petua tangan kiri Fleming. Apakah yang diwakili oleh ibu jari?", ["Daya", "Arus", "Medan magnet", "Medan elektromagnet"], 0, "Ibu jari = daya (gerakan), jari telunjuk = medan magnet, jari hantu = arus.", ""], [33, "Rajah 25 menunjukkan sebatang magnet bar yang digerakkan masuk dan keluar dari sebuah gegelung yang disambungkan kepada galvanometer. Apakah perubahan yang akan meningkatkan pesongan penunjuk galvanometer?", ["Mengurangkan bilangan lilitan gegelung", "Menambahkan bilangan lilitan gegelung", "Mengurangkan kekuatan magnet", "Menggerakkan magnet dengan lebih perlahan"], 1, "Lilitan lebih banyak meningkatkan e.m.d. teraruh dan arus teraruh.", ""], [34, "Rajah 26 menunjukkan sebuah transformer unggul yang disambungkan kepada perintang 8 Ω. Voltan input transformer ialah 240 V dan kuasa input ialah 120 W. Berapakah arus yang mengalir melalui perintang 8 Ω?", ["3.87 A", "6.90 A", "7.00 A", "12.2 A"], 0, "Transformer unggul: kuasa output = 120 W = I²R, maka I² = 120/8 = 15 dan I = 3.87 A.", ""], [35, "Rajah 27 menunjukkan sinar katod dalam satu tiub vakum. Antara yang berikut, pernyataan manakah boleh disimpulkan dengan sinar katod?", ["Menghasilkan kesan berpendarfluor", "Boleh dipesongkan oleh medan elektrik", "Boleh dipesongkan oleh medan magnet", "Mempunyai momentum dan tenaga kinetik"], 1, "Rajah menunjukkan sinar katod terpesong di antara dua plat bercas, maka boleh dipesongkan oleh medan elektrik. Nota: pilihan lain juga benar secara umum, tetapi hanya B ditunjukkan dalam rajah.", ""], [36, "Rajah 28 menunjukkan sebuah litar asas rektifikasi gelombang penuh menggunakan empat diod. Apakah fungsi utama diod dalam litar tersebut?", ["Menstabilkan voltan dalam litar", "Menukarkan arus ulang-alik kepada arus terus", "Mengurangkan nilai voltan arus ulang-alik", "Menyimpan cas elektrik untuk digunakan kemudian"], 1, "Diod membenarkan arus mengalir satu arah sahaja (rektifikasi); kapasitor yang melicinkan.", ""], [37, "Rajah 29 menunjukkan siri reputan radioaktif bagi nukleus R menjadi nukleus V. Berapakah bilangan zarah alfa dan zarah beta yang dibebaskan dalam proses ini?", ["Alfa 2, beta 1", "Alfa 1, beta 2", "Alfa 2, beta 2", "Alfa 1, beta 1"], 2, "R(84, 216) → V(82, 208): nukleon berkurang 8 = 2 alfa (proton turun 4 kepada 80). Proton perlu naik 2 untuk jadi 82, maka 2 beta.", ""]];
